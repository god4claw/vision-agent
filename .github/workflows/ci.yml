name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        env:
          CGO_ENABLED: 1
        run: go vet ./...
      - name: go test
        env:
          CGO_ENABLED: 1
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        env:
          CGO_ENABLED: 1
        with:
          version: v2.12.2
